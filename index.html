<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>受験対策ドリル｜8週間 試験対策講座</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--orange:#f26b3b;--brown:#553727;--bg:#f9f7ef;--blue:#0085c9;--sub:#85634b;--line:rgba(85,55,39,.18);--pale:#fdeee8;--bpale:#e6f3fa;--ok:#2e7d4f;--okpale:#e7f4ec;--ng:#c0392b;--ngpale:#fbe9e6;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",sans-serif;background:var(--bg);color:var(--brown);line-height:1.85;-webkit-font-smoothing:antialiased;min-height:100vh}
header{background:#fff;border-top:6px solid var(--orange);border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:10}
header .in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
header .lb{font-size:11px;letter-spacing:.1em;color:var(--sub)}
header h1{font-family:"Zen Old Mincho",serif;font-size:18px;font-weight:700;line-height:1.4}
header .hb{display:flex;gap:6px;align-items:center;flex-shrink:0}
header .hm{flex-shrink:0;font-size:13px;font-weight:700;color:var(--blue);background:none;border:0;font-family:inherit;cursor:pointer;padding:6px 4px}
.prog{max-width:760px;margin:0 auto;padding:10px 16px 0;display:none}
.bar{height:7px;background:#fff;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--orange);width:0;transition:width .3s}
.pt{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:5px;font-weight:500}
main{max-width:760px;margin:0 auto;padding:16px 16px 70px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 16px;margin-bottom:14px}
h2{font-family:"Zen Old Mincho",serif;font-size:20px;font-weight:700;line-height:1.5;margin-bottom:10px}
h3{font-family:"Zen Old Mincho",serif;font-size:16px;font-weight:700;margin:14px 0 6px}
p{margin-bottom:10px} ul.pl{list-style:none;margin:6px 0 12px} ul.pl li{padding-left:1.1em;text-indent:-1.1em;margin:4px 0;font-size:14.5px}
ul.pl li::before{content:"・";color:var(--orange);font-weight:700}
.note{font-size:13px;color:var(--sub);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin:10px 0}
label.f{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input[type=text],input[type=password]{width:100%;font-family:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--brown)}
input:focus{outline:none;border-color:var(--orange)}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--orange);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
.btn:disabled{background:#e9ddd5;color:#a08a7a;cursor:default}
.btn.sub{background:#fff;color:var(--brown);border:1.5px solid var(--line)}
.btn.blue{background:var(--blue)}
.nav{display:flex;gap:10px;margin-top:16px}.nav .btn{margin-top:0}
.err{color:var(--ng);font-size:13px;margin-top:8px;min-height:1em}
.tag{display:inline-block;background:var(--pale);color:var(--orange);font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px;margin:0 6px 8px 0}
.tag.g{background:var(--bg);color:var(--sub)}
.qt{font-size:16.5px;font-weight:500;line-height:1.8;margin-bottom:8px}
.hint{display:inline-block;font-size:13px;font-weight:700;padding:6px 12px;border-radius:8px;margin-bottom:12px;background:var(--bpale);color:var(--blue)}
.hint.neg{background:var(--pale);color:#b5481f}
/* 選択肢（○選ぶ／×選ばない） */
.op{border:2px solid var(--line);border-radius:12px;padding:11px 12px 12px;margin-bottom:10px;background:var(--bg)}
.op .tx{font-size:15px;line-height:1.7;margin-bottom:9px}
.op .tx b{color:var(--orange);margin-right:.3em}
.ox{display:flex;gap:8px}
.ox button{flex:1;padding:9px 4px;border:2px solid var(--line);border-radius:9px;background:#fff;font-family:inherit;font-size:15px;font-weight:700;color:var(--sub);cursor:pointer}
.ox button.on.y{background:var(--orange);border-color:var(--orange);color:#fff}
.ox button.on.n{background:var(--brown);border-color:var(--brown);color:#fff}
.op.done{border-color:var(--orange);background:#fff}
.conf{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.conf .lbl{font-weight:700;font-size:14px;margin-bottom:8px}
.conf .ox button{font-size:14px;padding:9px 2px;white-space:nowrap}
.conf .ox button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.miss{font-size:13px;color:var(--sub);text-align:center;margin-top:8px;min-height:1em}
/* 答え合わせ */
.rs{border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fff}
.rs.ok{border-color:#b9dcc6}.rs.ng{border-color:#efb5ab;background:var(--ngpale)}
.rs .tx{font-size:14.5px;line-height:1.7;margin-bottom:6px}.rs .tx b{color:var(--orange);margin-right:.3em}
.rs .mk{font-size:13px;font-weight:700;display:flex;flex-wrap:wrap;gap:4px 12px}
.rs .mk .r{color:var(--ok)}.rs.ng .mk .r{color:var(--ng)}
.rs .tf{font-size:12.5px;color:var(--sub)}
.rs .ow{font-size:13.5px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.ex{background:var(--bpale);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.ex .h{font-weight:700;color:var(--blue);font-size:13px}
.st{font-size:12.5px;color:var(--sub);text-align:right;margin-top:8px}
/* はじめ */
.set{display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;background:var(--bg);font-family:inherit;color:var(--brown);cursor:pointer}
.set.now{border-color:var(--orange);background:#fff}
.set .nm{font-family:"Zen Old Mincho",serif;font-weight:700;font-size:17px}
.set .nm small{font-family:"Noto Sans JP",sans-serif;font-size:12px;color:var(--orange);margin-left:.6em}
.set .dt{font-size:12.5px;color:var(--sub)}
.set .pg{height:5px;background:#fff;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.set .pg i{display:block;height:100%;background:var(--orange)}
.pk{display:block;margin:8px 0}
.pk summary{cursor:pointer;font-weight:700;font-size:15px;padding:8px 0;color:var(--brown)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips button,.chips select{font-family:inherit;font-size:13.5px;border:1.5px solid var(--line);background:#fff;color:var(--brown);border-radius:99px;padding:5px 12px;cursor:pointer}
.chips button.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.pr{display:flex;gap:10px;align-items:flex-start;border-top:1px dashed var(--line);padding:8px 0;font-size:14px;line-height:1.6}
.pr input{margin-top:5px;width:20px;height:20px;flex-shrink:0;accent-color:var(--orange)}
.pr .m{font-size:12px;color:var(--sub)}
.pr .st2{margin-left:auto;font-size:12px;white-space:nowrap;color:var(--sub)}
.pr .st2.ng{color:var(--ng)}.pr .st2.okk{color:var(--ok)}
.lecs .set .nm{font-size:16px}
.who{font-size:13px;color:var(--sub);margin-bottom:6px}.who button{font-size:13px;color:var(--blue);background:none;border:0;font-family:inherit;cursor:pointer;text-decoration:underline}
.rv{font-size:14px;border-top:1px dashed var(--line);padding:7px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.rv button{flex-shrink:0;font-size:13px;color:var(--blue);background:none;border:1.5px solid var(--blue);border-radius:8px;padding:3px 10px;font-family:inherit;cursor:pointer}
footer{text-align:center;font-size:12px;color:var(--sub);padding:24px 0 40px}
</style>
</head>
<body>
<header><div class="in"><div><div class="lb">8週間 試験対策講座</div><h1 id="ttl">受験対策ドリル</h1></div><div class="hb"><button class="hm" id="bk" style="display:none">← 戻る</button><button class="hm" id="hm" style="display:none">はじめの画面へ</button></div></div></header>
<div class="prog" id="pw"><div class="bar"><div class="fill" id="pf"></div></div><div class="pt"><span id="pt"></span><span id="pa"></span></div></div>
<main id="app"></main>

async function unlock(pass){
  const enc=new TextEncoder(), base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(BLOB.s),iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(BLOB.i)},key,ub(BLOB.d));
  return JSON.parse(new TextDecoder().decode(pt));
}

function mergeHist(a,b){const o={};new Set([...Object.keys(a||{}),...Object.keys(b||{})]).forEach(n=>{
  const seen=new Set(),arr=[...(a[n]||[]),...(b[n]||[])].filter(x=>{const k=x.t;if(seen.has(k))return false;seen.add(k);return true;}).sort((x,y)=>x.t-y.t);

function renderCode(mail,msg){
  app.innerHTML=`<div class="card"><h2>コードを入れてください</h2>
    <p style="font-size:14.5px">${esc(maskMail(mail))} が対策講座に登録されていれば、6桁のコードが届きます（10分のあいだ使えます）。届かないときは、迷惑メールのフォルダも見てください。それでも届かないときは、登録のメールアドレスが違うかもしれません。school@iob.bio までお知らせください。</p>
    <input type="text" id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6桁のコード">
    <div class="err" id="err">${msg||""}</div>
    <button class="btn" id="vf">ひらく</button>
    <button class="btn sub" id="rs">コードをもう一度送る</button>
    <button class="btn sub" id="bk3">メールアドレスを入れ直す</button></div>`;
  document.getElementById("vf").onclick=async()=>{const c=document.getElementById("cd").value.trim(),e=document.getElementById("err"),b=document.getElementById("vf");
    if(!/^\d{6}$/.test(c)){e.textContent="6桁の数字を入れてください。";return;}
    b.disabled=true;e.textContent="確かめています…";
    try{const r=await authCall({op:"verify",email:mail,code:c});
      if(r.ok){store.set("drl_tok",r.token);store.set("drl_mail",maskMail(mail));if(r.nick)store.set("drl_nick_auto",r.nick);store.del("drl_skip");
        app.innerHTML='<div class="card"><p>記録を読み込んでいます…</p></div>';try{await pullRemote();}catch(x){}renderHome();flush();return;}
      e.textContent=r.msg==="expired"?"コードの時間が切れました。「コードをもう一度送る」を押してください。":"コードがちがうようです。もう一度入れてください。";}
    catch(x){e.textContent="確かめられませんでした。電波のよい所で、もう一度押してください。";}
    b.disabled=false;};
  document.getElementById("rs").onclick=async()=>{const e=document.getElementById("err");e.textContent="送っています…";
    try{const r=await authCall({op:"sendcode",email:mail});e.textContent=r.ok?"もう一度送りました。":"短い間にたくさん送りました。1時間ほどあけてください。";}catch(x){e.textContent="送れませんでした。";}};
  document.getElementById("bk3").onclick=()=>renderLogin("",mail);
}

/* ── はじめの画面：名前とセット ── */
function renderHome(){
  pw.style.display="none";hm.style.display="none";run=null;backTo(null);
  /* ログインしている人には、ニックネームを聞かない（メールの前半を、記録の呼び名に使う） */
  if(!nick()&&tok()&&store.get("drl_nick_auto"))store.set("drl_nick",store.get("drl_nick_auto"));
  const nk=nick();
  if(!nk)return renderName();
  const h=hist(), cs=curSet();
  const sets=SETS.map(s=>{const nos=QS.filter(q=>q.n>=s.from&&q.n<=s.to).map(q=>q.n), done=nos.filter(n=>h[n]&&h[n].length).length;
    return `<button class="set ${s.id===cs.id?"now":""}" data-s="${s.id}"><div class="nm">${esc(s.label)}　${esc(s.sub)}<small>${nos.length}問</small></div>
      <div class="dt">${+s.start.slice(5,7)}/${+s.start.slice(8)}から${s.id===cs.id?"（今週）":""}　${done?`解いた ${done} / ${nos.length}`:""}</div>
      <div class="pg"><i style="width:${nos.length?done/nos.length*100:0}%"></i></div></button>`;}).join("");
  const r2=QS.filter(q=>needsReview(lastOf(q.n))).map(q=>q.n);
  const wr=QS.filter(q=>isWrong(q.n)).map(q=>q.n), un=QS.filter(q=>isUnsure(q.n)).map(q=>q.n);
  const qn=(store.get("drl_queue")||[]).length;
  app.innerHTML=`<div class="card">
    <div class="who">${esc(nk)}さん　<button id="rn">名前を変える</button><br>${tok()?`ログイン中（${esc(store.get("drl_mail")||"")}）　<button id="lo">ログアウト</button>`:(ENDPOINT?`<button id="li">メールでログイン（記録を引き継げます）</button>`:"")}</div>
    <h2>解くセットを選んでください</h2>
    <ul class="pl">
      <li>選択肢の1つずつに「○ 選ぶ」か「× 選ばない」をつけます</li>
      <li>最後に、その問題の自信を ○ △ × で選びます</li>
      <li>「答え合わせ」を押すと、正しい答えと解説が出ます。点数は出ません</li>
      <li>答えは講師（レムケなつこ）に届き、次の講座で取り上げる問題を選ぶのに使います</li>
    </ul>
    ${sets}
  </div>
  ${r2.length?`<div class="card"><h2>2周目</h2><p>まちがえた問題と、△・×をつけた問題だけをもう一度解きます。</p><button class="btn blue" id="r2">2周目を解く（${r2.length}問）</button></div>`:""}
  ${(wr.length||un.length)?`<div class="card"><h2>復習する</h2><p style="font-size:13.5px">まちがえた問題と、自信が○でなかった（迷った）問題を、別々に解き直せます。</p>
    <button class="btn" id="rwr" ${wr.length?"":"disabled"}>まちがえた問題を解く（${wr.length}問）</button>
    <button class="btn blue" id="run_un" ${un.length?"":"disabled"}>迷った問題を解く（${un.length}問）</button></div>`:""}
  ${freeCards(h)}
  ${anyHist()?`<div class="card"><h2>私の足跡</h2><p style="font-size:13.5px">これまでに解いた問題と、回ごとの答え（日時つき）を見られます。</p><button class="btn sub" id="tr0">足跡を見る</button></div>`:""}
  ${qn?`<div class="card"><p>まだ講師に届いていない答えが ${qn}件 あります。</p><button class="btn sub" id="fl">いま送る</button><div class="err" id="fle"></div></div>`:""}
  <div class="note">講座の内容を確かめる練習問題です。本試験の問題とは別のものです。</div>`;
  app.querySelectorAll(".set").forEach(b=>b.onclick=()=>startSet(b.dataset.s));
  document.getElementById("rn").onclick=renderName;
  if(document.getElementById("lo"))document.getElementById("lo").onclick=()=>{store.del("drl_tok");store.del("drl_mail");store.set("drl_skip",1);renderHome();};
  if(document.getElementById("li"))document.getElementById("li").onclick=()=>{store.del("drl_skip");renderLogin();};
  if(store.get("drl_dirty"))pushRemote();
  bindFree();
  if(document.getElementById("rwr")){document.getElementById("rwr").onclick=()=>startPick(wr,"まちがえた問題",false);document.getElementById("run_un").onclick=()=>startPick(un,"迷った問題",false);}
  if(r2.length)document.getElementById("r2").onclick=()=>startR2(r2);
  if(document.getElementById("tr0"))document.getElementById("tr0").onclick=()=>renderAllTrail(renderHome);
  if(qn)document.getElementById("fl").onclick=async()=>{await flush();const left=(store.get("drl_queue")||[]).length;
    if(left)document.getElementById("fle").textContent="まだ送れませんでした。電波のよい所で、もう一度押してください。";else renderHome();};
  window.scrollTo(0,0);
}
/* ── 自由に選んで解く：テーマ（講座）別／問題を選ぶ ── */
function startPick(list,name,shuffle){
  list=list.slice();
  if(shuffle)for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]];}
  if(!list.length)return;
  run={mode:"pick",name,list,i:0,done:[]};renderQ();
}
const lecList=()=>{const m={};QS.forEach(q=>{(m[q.l]=m[q.l]||[]).push(q.n);});return Object.keys(m).map(Number).sort((a,b)=>a-b).map(l=>({l,nos:m[l]}));};
function statusOf(n){const a=lastOf(n);return !a?{t:"まだ",c:""}:a.ok&&a.conf==="○"?{t:"○ 前回よくできた",c:"okk"}:!a.ok?{t:"× 前回まちがえた",c:"ng"}:{t:"△ 前回迷った",c:"ng"};}
function freeCards(h){
  const lecs=lecList().map(x=>{const done=x.nos.filter(n=>h[n]&&h[n].length).length;
    return `<button class="set" data-l="${x.l}"><div class="nm">${esc(TITLES[x.l]||("講座"+x.l))}<small>${x.nos.length}問</small></div>
      <div class="dt">${done?`解いた ${done} / ${x.nos.length}`:"まだ解いていません"}</div><div class="pg"><i style="width:${x.nos.length?done/x.nos.length*100:0}%"></i></div></button>`;}).join("");
  const opts=lecList().map(x=>`<option value="${x.l}">${esc(TITLES[x.l]||("講座"+x.l))}</option>`).join("");
  return `<div class="card lecs"><details class="pk"><summary>テーマ（講座）ごとに解く</summary>
      <p style="font-size:13.5px">気になるテーマだけ、続けて解けます。解いたことのある問題も、もう一度解けます。</p>${lecs}</details></div>
    <div class="card"><details class="pk" id="pkd"><summary>問題を選んで解く（復習・力試し）</summary>
      <div class="chips" id="pkf"><button data-f="all" class="on">すべて</button><button data-f="new">まだ解いていない</button><button data-f="wr">まちがえた</button><button data-f="un">迷った</button>
        <select id="pkl"><option value="">すべてのテーマ</option>${opts}</select></div>
      <div class="chips"><button id="pka">表示中を全部選ぶ</button><button id="pkc">選びを外す</button></div>
      <div id="pkr"></div>
      <label style="display:block;font-size:14px;margin-top:10px"><input type="checkbox" id="pks"> 順番をシャッフルして解く</label>
      <button class="btn" id="pkg" disabled>選んだ問題を解く</button></details></div>`;
}
function bindFree(){
  app.querySelectorAll(".lecs .set").forEach(b=>b.onclick=()=>{const l=+b.dataset.l, x=lecList().find(y=>y.l===l);startPick(x.nos,TITLES[l]||("講座"+l),false);});
  const box=document.getElementById("pkr");if(!box)return;
  let f="all", lec="";const sel=new Set();
  const draw=()=>{
    const rows=QS.filter(q=>(!lec||q.l===+lec)&&(f==="all"||(f==="new"?!lastOf(q.n):f==="wr"?isWrong(q.n):isUnsure(q.n))));
    box.innerHTML=rows.length?rows.map(q=>{const st=statusOf(q.n);
      return `<label class="pr"><input type="checkbox" data-n="${q.n}" ${sel.has(q.n)?"checked":""}><span><b>${qid(q.n)}</b>　${esc(TITLES[q.l]||"")}<br><span class="m">${esc(q.s.slice(0,40))}${q.s.length>40?"…":""}</span></span><span class="st2 ${st.c}">${st.t}</span></label>`;}).join("")
      :`<p style="font-size:13.5px;margin:8px 0">この条件の問題はありません。</p>`;
    box.querySelectorAll("input").forEach(c=>c.onchange=()=>{c.checked?sel.add(+c.dataset.n):sel.delete(+c.dataset.n);upd();});
    upd();};
  const upd=()=>{const g=document.getElementById("pkg");g.disabled=!sel.size;g.textContent=sel.size?`選んだ ${sel.size}問を解く`:"選んだ問題を解く";};
  document.querySelectorAll("#pkf button").forEach(b=>b.onclick=()=>{f=b.dataset.f;document.querySelectorAll("#pkf button").forEach(x=>x.classList.toggle("on",x===b));draw();});
  document.getElementById("pkl").onchange=e=>{lec=e.target.value;draw();};
  document.getElementById("pka").onclick=()=>{box.querySelectorAll("input").forEach(c=>{c.checked=true;sel.add(+c.dataset.n);});upd();};
  document.getElementById("pkc").onclick=()=>{sel.clear();box.querySelectorAll("input").forEach(c=>c.checked=false);upd();};
  document.getElementById("pkg").onclick=()=>{const list=QS.map(q=>q.n).filter(n=>sel.has(n));startPick(list,"選んだ問題",document.getElementById("pks").checked);};
  draw();
}
function renderName(){
  pw.style.display="none";hm.style.display="none";backTo(nick()?renderHome:null);
  const pre=nick()||store.get("g35nick")||"";
  app.innerHTML=`<div class="card"><h2>受験対策ドリル</h2>
    <label class="f" for="nick">ニックネーム（35問のときと同じ名前で大丈夫です）</label>
    <input type="text" id="nick" maxlength="12" value="${esc(pre)}" placeholder="例：はなこ">
    <div class="err" id="err"></div><button class="btn" id="ok">次へ</button></div>`;
  document.getElementById("ok").onclick=()=>{const v=document.getElementById("nick").value.trim().replace(/[:：\s]/g,"");
    if(!v){document.getElementById("err").textContent="ニックネームを入れてください。";return;}
    store.set("drl_nick",v);renderHome();};
}

/* ── 解く並び ── */
function startSet(id){
  const s=SETS.find(x=>x.id===id), list=QS.filter(q=>q.n>=s.from&&q.n<=s.to).map(q=>q.n), h=hist();
  let i=list.findIndex(n=>!(h[n]&&h[n].length)); if(i<0)return renderEnd({mode:id,list,i:list.length});
  run={mode:id,list,i};renderQ();
}
function startR2(list){const sv=store.get("drl_r2");
  run=(sv&&sv.list&&sv.i<sv.list.length&&sv.list.join()===list.join())?sv:{mode:"r2",list,i:0,done:[]};
  store.set("drl_r2",run);renderQ();}
function label(){return run.mode==="r2"?"2周目":run.mode==="pick"?(run.name||"選んだ問題"):SETS.find(s=>s.id===run.mode).label;}
function setProg(){pw.style.display="block";hm.style.display="block";backTo(()=>{if(run.i>0){run.i--;saveRun();renderQ();}else renderHome();});
  const h=hist(), done=isFree()?(run.done||[]).length:run.list.filter(n=>h[n]&&h[n].length).length;
  document.getElementById("pf").style.width=(done/run.list.length*100)+"%";
  document.getElementById("pt").textContent=`${label()}　${Math.min(run.i+1,run.list.length)} / ${run.list.length}`;
  document.getElementById("pa").textContent=`解いた ${done} / ${run.list.length}`;}
/* 私の足跡（これまでの答え：何回目・日時・結果・自信） */
const histOf=n=>hist()[n]||[];
const dtOf=t=>{const d=new Date(t+9*3600e3),z=x=>String(x).padStart(2,"0");return (d.getUTCMonth()+1)+"/"+d.getUTCDate()+" "+z(d.getUTCHours())+":"+z(d.getUTCMinutes());};
function histBox(n){const hs=histOf(n);if(!hs.length)return "";
  return `<div class="ex"><div class="h">この問題は ${hs.length}回 解いています</div>
    <button class="btn sub" id="ps" style="margin-top:8px">私の足跡を見る</button></div>`;}
let trailBack=null;
const anyHist=()=>Object.keys(hist()).some(k=>hist()[k]&&hist()[k].length);
function trailHead(back){
  if(back)trailBack=back;
  if(run&&run.list&&run.list.length)setProg();else{pw.style.display="none";hm.style.display="block";}
  backTo(()=>trailBack?trailBack():renderHome());}
function retryQ(q){
  if(!(run&&run.list&&run.list[run.i]===q.n))run={mode:"pick",name:"解き直し",list:[q.n],i:0,done:[]};
  renderQ();}
/* 解いた問題の一覧（どこからでも開ける） */
function renderAllTrail(back){
  trailHead(back);
  const ns=QS.map(q=>q.n).filter(n=>histOf(n).length);
  app.innerHTML=`<div class="card"><h3>私の足跡</h3>
    <p style="font-size:13.5px">これまでに解いた問題です。見たい問題の「見る」を押すと、回ごとの答えが選べます。</p>
    ${ns.length?ns.map(n=>{const a=lastOf(n);return `<div class="rv"><span>${qid(n)}　講座${QN[n].l}　${histOf(n).length}回<br>いちばん新しい答え：${a.ok?"○ 正解":"× まちがい"}　自信 ${esc(a.conf)}</span><button data-n="${n}">見る</button></div>`;}).join(""):"<p>まだ解いた問題がありません。</p>"}
    <div class="nav" style="margin-top:12px"><button class="btn sub" id="bk3">もどる</button></div></div>`;
  app.querySelectorAll(".rv button").forEach(b=>b.onclick=()=>renderTrail(QN[+b.dataset.n],()=>renderAllTrail(back)));
  document.getElementById("bk3").onclick=()=>back?back():renderHome();
  window.scrollTo(0,0);}
/* 1問の足あと（回ごとの答え・日時つき） */
function renderTrail(q,back){
  trailHead(back);const hs=histOf(q.n);
  app.innerHTML=`<div class="card"><span class="tag">${qid(q.n)}</span><span class="tag g">講座${q.l}</span>
    <h3>私の足跡</h3><div class="qt" style="font-size:15px">${esc(q.s)}</div><p style="font-size:13.5px">見たい回をえらぶと、そのときの答えと解説が出ます。</p>
    ${hs.slice().reverse().map(a=>`<div class="rv"><span>${a.r}回目の結果（${dtOf(a.t)}）<br>${a.ok?"○ 正解":"× まちがい"}　自信 ${esc(a.conf)}</span><button data-r="${a.r}">見る</button></div>`).join("")}
    <div class="nav" style="margin-top:12px"><button class="btn sub" id="bk2">もどる</button><button class="btn" id="rs">もう一度解く</button></div></div>`;
  app.querySelectorAll(".rv button").forEach(b=>b.onclick=()=>renderResult(q,hs.find(a=>a.r===+b.dataset.r),false));
  document.getElementById("bk2").onclick=()=>trailBack?trailBack():renderQ();document.getElementById("rs").onclick=()=>retryQ(q);
  window.scrollTo(0,0);}
/* この並びの中で、もう答え合わせ済みか（2周目は、2周目で解いたか） */
function answeredHere(n){if(isFree())return (run.done||[]).includes(n);const h=hist();return !!(h[n]&&h[n].length);}

function renderQ(){
  if(run.i>=run.list.length)return renderEnd(run);
  const n=run.list[run.i], q=QN[n];setProg();
  draft={sel:[null,null,null,null,null],conf:null};
  const neg=q.p==="誤";
  app.innerHTML=`<div class="card">
    <span class="tag">${qid(n)}</span><span class="tag g">講座${q.l}</span>
    <div class="qt">${esc(q.s)}</div>
    <div class="hint ${neg?"neg":""}">${neg?"「誤っているもの」に ○ をつけます":"「正しいもの」に ○ をつけます"}</div>
    ${q.o.map((o,k)=>`<div class="op" id="op${k}"><div class="tx"><b>${L[k]}.</b>${esc(o)}</div>
      <div class="ox"><button class="y" data-k="${k}" data-v="1">○ 選ぶ</button><button class="n" data-k="${k}" data-v="0">× 選ばない</button></div></div>`).join("")}
    <div class="conf"><div class="lbl">この問題の自信</div>
      <div class="ox" id="cf"><button data-c="○">○ ある</button><button data-c="△">△ 迷った</button><button data-c="×">× わからない</button></div></div>
    <button class="btn" id="ck" disabled>答え合わせ</button><div class="miss" id="ms"></div>
    ${anyHist()?'<button class="btn sub" id="ps" style="margin-top:10px">私の足跡を見る</button>':""}
    <div class="nav">${run.i>0?'<button class="btn sub" id="pv">前の問題</button>':""}<button class="btn sub" id="sk">${histOf(n).length?"解かずに次へ":"あとで解く"}</button></div></div>`;
  if(anyHist())document.getElementById("ps").onclick=()=>histOf(n).length?renderTrail(q,renderQ):renderAllTrail(renderQ);
  const upd=()=>{const left=draft.sel.filter(v=>v===null).length;
    document.getElementById("ck").disabled=!!(left||!draft.conf);
    document.getElementById("ms").textContent=left?`あと ${left}つ、○か×をつけてください`:(!draft.conf?"自信を選んでください":"");};
  app.querySelectorAll(".op .ox button").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;draft.sel[k]=+b.dataset.v;
    const box=document.getElementById("op"+k);box.classList.add("done");box.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));upd();});
  app.querySelectorAll("#cf button").forEach(b=>b.onclick=()=>{draft.conf=b.dataset.c;app.querySelectorAll("#cf button").forEach(x=>x.classList.toggle("on",x===b));upd();});
  document.getElementById("ck").onclick=()=>check(q);
  if(run.i>0)document.getElementById("pv").onclick=()=>{run.i--;saveRun();renderQ();};
  document.getElementById("sk").onclick=()=>{run.i++;saveRun();renderQ();};
  upd();window.scrollTo(0,0);
}
function saveRun(){if(run&&run.mode==="r2")store.set("drl_r2",run);}

/* ── 答え合わせ：記録して送る ── */
function check(q){
  const want=shouldSel(q), sel=draft.sel.map(v=>v===1);
  const ok=want.every((w,k)=>w===sel[k]);
  const h=hist(), prev=h[q.n]||[], t=Date.now();
  const a={r:prev.length+1,sel:draft.sel,conf:draft.conf,ok,t};
  h[q.n]=prev.concat([a]);store.set("drl_hist",h);store.set("drl_dirty",1);pushRemote();
  if(isFree()){run.done=(run.done||[]).concat([q.n]);saveRun();}
  const s=setOf(q.n), mark=b=>b?"○":"×";
  const wrong=want.map((w,k)=>w!==sel[k]?k:-1).filter(k=>k>=0);
  const payload={kind:"drill",v:1,id:cid()+"-"+q.n+"-"+t,nick:nick(),cid:cid(),ver:VER,
    set:s?s.id:"",setLabel:s?s.label:"",setN:s?s.n:0,mode:run.mode,round:a.r,
    no:q.n,ch:q.c,lec:q.l,pol:q.p,stem:q.s.slice(0,400),
    sel:sel.map(mark).join(""),right:want.map(mark).join(""),
    wrong:wrong.map(k=>({l:L[k],text:q.o[k].slice(0,300),should:want[k]?"選ぶ":"選ばない",truth:q.t[k]?"正しい文":"誤りの文"})),
    conf:a.conf,ok,back:q.b.slice(0,300),t,tok:tok()||undefined};
  const qu=store.get("drl_queue")||[];qu.push(payload);store.set("drl_queue",qu);
  renderResult(q,a,true);
  flush();
}
/* 届いていない答えを順に送る */
let flushing=null;
function flush(){
  if(flushing)return flushing;
  flushing=(async()=>{
    await null; // 先に flushing を代入させる（空のときに同期で終わって null が上書きされないように）
    while(true){const qu=store.get("drl_queue")||[];if(!qu.length||!ENDPOINT)break;
      try{const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(qu[0])});
        const j=await r.json();if(!j.ok)throw 0;
        const now=store.get("drl_queue")||[];store.set("drl_queue",now.filter(x=>x.id!==qu[0].id));}
      catch(e){break;}}
    flushing=null;showSent();
  })();
  return flushing;
}
function showSent(){const el=document.getElementById("sst");if(!el)return;const qn=(store.get("drl_queue")||[]).length;
  el.textContent=!ENDPOINT?"（送り先が未設定のため、送っていません）":qn?`まだ届いていない答え ${qn}件（あとで自動で送ります）`:"講師に届きました";}

function renderResult(q,a,fresh){
  const cur=!!(run&&run.list&&run.list[run.i]===q.n);
  if(cur)setProg();else trailHead();
  const want=shouldSel(q), neg=q.p==="誤", mine=a?a.sel.map(v=>v===1):null;
  const rows=q.o.map((o,k)=>{const okk=mine?mine[k]===want[k]:true;
    return `<div class="rs ${mine?(okk?"ok":"ng"):""}"><div class="tx"><b>${L[k]}.</b>${esc(o)}</div>
      <div class="mk">${mine?`<span>あなた：${mine[k]?"○ 選ぶ":"× 選ばない"}</span>`:""}<span class="r">正しくは：${want[k]?"○ 選ぶ":"× 選ばない"}${mine?(okk?"　✓":"　← ここが違う"):""}</span></div>
      <div class="tf">この文は${q.t[k]?"正しい":"誤り"}</div>
      ${q.ow&&q.ow[k]?`<div class="ow">${esc(q.ow[k])}</div>`:""}</div>`;}).join("");
  const isLast=!cur||run.i>=run.list.length-1;
  app.innerHTML=`<div class="card">
    <span class="tag">${qid(q.n)}</span><span class="tag g">講座${q.l}</span>${a?`<span class="tag g">自信 ${esc(a.conf)}</span>`:""}${a&&!fresh?`<span class="tag g">${a.r}回目の結果（${dtOf(a.t)}）</span>`:""}
    <div class="qt">${esc(q.s)}</div>
    <div class="hint ${neg?"neg":""}">${neg?"「誤っているもの」を選ぶ問題":"「正しいもの」を選ぶ問題"}</div>
    ${rows}
    ${!q.ow&&q.w?`<div class="ex"><div class="h">解説</div>${esc(q.w)}</div>`:""}
    ${q.b?`<div class="ex"><div class="h">戻る場所</div>${esc(q.b)}</div>`:""}
    <div class="st" id="sst"></div>
    ${fresh?"":'<button class="btn sub" id="tr" style="margin-bottom:8px">私の足跡へ</button><button class="btn sub" id="rs" style="margin-bottom:8px">この問題をもう一度解く</button>'}
    ${cur?`<div class="nav">${run.i>0?'<button class="btn sub" id="pv">前の問題</button>':""}<button class="btn" id="nx">${isLast?"終わる":"次の問題へ"}</button></div>`:'<div class="nav"><button class="btn" id="bk4">足跡にもどる</button></div>'}</div>`;
  if(cur){if(run.i>0)document.getElementById("pv").onclick=()=>{run.i--;saveRun();renderQ();};
    document.getElementById("nx").onclick=()=>{run.i++;saveRun();renderQ();};}
  else document.getElementById("bk4").onclick=()=>renderTrail(q);
  if(!fresh){document.getElementById("rs").onclick=()=>retryQ(q);document.getElementById("tr").onclick=()=>renderTrail(q);}
  if(fresh)showSent();else document.getElementById("sst").textContent="";
  window.scrollTo(0,0);
}

/* ── セットの終わり ── */
function renderEnd(r){
  pw.style.display="none";hm.style.display="block";backTo(()=>{run={...r,i:Math.max(0,r.list.length-1)};saveRun();renderQ();});
  const h=hist(), fr=(r.mode==="r2"||r.mode==="pick"), skipped=r.list.filter(n=>fr?!(r.done||[]).includes(n):!(h[n]&&h[n].length));
  const rv=r.list.filter(n=>needsReview(lastOf(n)));
  if(r.mode==="r2"&&!skipped.length)store.del("drl_r2");
  app.innerHTML=`<div class="card"><h2>${r.mode==="r2"?"2周目":r.mode==="pick"?esc(r.name||"選んだ問題"):esc(SETS.find(s=>s.id===r.mode).label)}が終わりました</h2>
    ${skipped.length?`<p>まだ解いていない問題が ${skipped.length}問 あります。</p><button class="btn" id="sk">まだの問題を解く</button>`:"<p>おつかれさまでした。</p>"}
    <div class="st" id="sst"></div></div>
    ${rv.length?`<div class="card"><h3>もう一度見ておきたい問題</h3><p style="font-size:13.5px">まちがえた問題と、△・×をつけた問題です。</p>
      ${rv.map(n=>`<div class="rv"><span>${qid(n)}　講座${QN[n].l}　${!lastOf(n).ok?"まちがえた":"自信 "+esc(lastOf(n).conf)}</span><button data-n="${n}">見る</button></div>`).join("")}
      <p style="font-size:13px;margin-top:10px">はじめの画面の「2周目」で、まとめて解き直せます。</p></div>`:""}
    <div class="card"><button class="btn sub" id="hb">はじめの画面へ</button></div>`;
  if(skipped.length)document.getElementById("sk").onclick=()=>{run={...r,i:r.list.indexOf(skipped[0])};saveRun();renderQ();};
  app.querySelectorAll(".rv button").forEach(b=>b.onclick=()=>{const n=+b.dataset.n;run={...r,i:r.list.indexOf(n)};
    if(fr&&!(run.done||[]).includes(n)){renderQ();return;}renderResult(QN[n],lastOf(n),false);});
  document.getElementById("hb").onclick=renderHome;
  showSent();window.scrollTo(0,0);
}
hm.onclick=renderHome;

(async()=>{
  /* ポータルから来たとき：URLのうしろに付いた札（#h=）とパスワード（p=）で、そのまま入る */
  let hp=null;try{hp=new URLSearchParams(location.hash.slice(1));if(hp.get("h")||hp.get("p"))history.replaceState(null,"",location.pathname+location.search);}catch(e){}
  const hPass=hp&&hp.get("p"),hTok=hp&&hp.get("h");
  for(const p of [hPass||"","",store.get("drl_pass")||""]){if(!p)continue;try{QS=await unlock(p);store.set("drl_pass",p);
    if(hTok&&ENDPOINT){try{const r=await authCall({op:"handoff",h:hTok});if(r.ok){store.set("drl_tok",r.token);store.set("drl_mail",r.mail||"");if(r.nick)store.set("drl_nick_auto",r.nick);store.del("drl_skip");}}catch(e){}}
    return ready();}catch(e){}}
  renderGate();
})();
window.addEventListener("online",()=>{if(QS){flush();if(store.get("drl_dirty"))pushRemote();}});
</script>
